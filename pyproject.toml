[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldwatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
    "h3>=3.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
worldwatch = "worldwatch.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worldwatch"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Query() in argument defaults is the intended pattern.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["h3", "h3.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
