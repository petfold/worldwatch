# Public, read-only Worldwatch dashboard at https://categor.io:8001
#
# Install (as root):
#   cp /opt/worldwatch/ops/nginx/worldwatch-public.conf /etc/nginx/sites-available/worldwatch
#   ln -s /etc/nginx/sites-available/worldwatch /etc/nginx/sites-enabled/worldwatch
#   ufw allow 8001/tcp
#   nginx -t && systemctl reload nginx
#
# uvicorn keeps listening on 127.0.0.1:8001 only; nginx binds the public
# addresses on the same port number, so the two don't collide. Writes are refused
# (alert labelling: through an SSH tunnel), except the pushes' Useful / Not useful
# buttons: POST to a feedback URL signed for its one alert and verdict.
# After changing this file: the cp line above, then nginx -t && systemctl reload nginx.
# Reuses the site's Let's Encrypt certificate; certbot's renewal reloads nginx.

limit_req_zone $binary_remote_addr zone=worldwatch:10m rate=10r/s;

server {
    listen 158.220.117.131:8001 ssl;
    listen [2a02:c207:2360:6875::1]:8001 ssl;
    server_name categor.io;

    ssl_certificate     /etc/letsencrypt/live/categor.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/categor.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # the page fetches several endpoints at once; allow a burst, keep the site safe
    limit_req zone=worldwatch burst=30 nodelay;
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_tokens off;

    # a push's feedback button (the signature is checked by the app)
    location ~ "^/api/feedback/[0-9]+/(useful|not_useful)/[0-9a-f]{32}$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        limit_except GET { deny all; }  # read-only in public (HEAD comes with GET)
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
