# --- the UAE -------------------------------------------------------------------------

[uae_air_defence]
class            = "security_reports"
modality         = "physical"
topic_tags       = ["security", "military", "uae"]
flavor           = "count"
endpoint         = "https://uaedefensemonitor.com/mod-reports.json"
cadence_seconds  = 3600
status           = "nursery"
notes            = "UAE Defense Monitor (unofficial; publishes this JSON as a dataset): daily drones and cruise and ballistic missiles engaged by UAE air defences, from the UAE Ministry of Defence's statements; one row per day with engagements. Daily, not live"

[uae_air_defence.parse]
format           = "records"
time_field       = "date"
time_format      = "%Y-%m-%d"
time_tz          = "+04:00"
value_sum        = ["daily_uavs_engaged", "daily_cruise_missiles_engaged", "daily_ballistic_missiles_engaged"]
min_value        = 1

[uae_air_defence.geocode]
strategy         = "fixed_latlon"
lat              = 24.45
lon              = 54.38
h3_resolution    = 3

[uae_air_defence.model]
native_seconds   = 86400

[uae_air_defence.display]
label            = "UAE air defence engagements (MoD, via UAE Defense Monitor)"
about            = "Drones and missiles the UAE's air defences engaged each day, from the Ministry of Defence's statements as compiled by the unofficial UAE Defense Monitor. Daily, a day behind: a record, not a warning."
unit             = "engaged"

[uae_air_defence.context]
fields           = ["date", "daily_uavs_engaged", "daily_cruise_missiles_engaged", "daily_ballistic_missiles_engaged", "tweet_text", "source_url"]
text             = "{date}|: {daily_uavs_engaged} drones|, {daily_cruise_missiles_engaged} cruise|, {daily_ballistic_missiles_engaged} ballistic missiles engaged"
link             = "source_url"

[uae_air_defence.alerts]
every_event      = true    # each day with engagements is reported, once
severity         = 0.8
fresh_seconds    = 172800  # a day's statement comes the next day
push_score       = 12      # among the most serious for someone in the UAE; not a wake-up (a day late)
reach_km         = 300
