min_level        = 2       # watches and warnings (information statements and advisories dropped)

[tsunami_ntwc.geocode]
h3_resolution    = 3

[tsunami_ntwc.display]
label            = "Tsunami warnings (NTWC)"
about            = "Tsunami watches and warnings from the US National Tsunami Warning Center (Alaska)."
unit             = "bulletins"

[tsunami_ntwc.context]
fields           = ["category", "region", "magnitude", "url"]
text             = "Tsunami {category}| for {region}| (M{magnitude})"
link             = "url"

[tsunami_ntwc.alerts]
every_event      = true    # authoritative: each watch or warning alerts (ADR 0001)
severity         = 0.95
fresh_seconds    = 7200
push_score       = 15      # confirmed, and extreme: may wake where it can reach
reach_km         = 1000

# --- space weather (NOAA SWPC): one cell, "SPACE", apart from Earth's streams -----

[swpc_kp]
class            = "space_weather"
modality         = "physical"
topic_tags       = ["space-weather", "geomagnetic"]
flavor           = "continuous"
endpoint         = "https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"
cadence_seconds  = 600
status           = "nursery"
notes            = "NOAA SWPC estimated planetary K index, 1-min; public domain"

[swpc_kp.parse]
format           = "records"
time_field       = "time_tag"
value_field      = "estimated_kp"

[swpc_kp.geocode]
cell             = "SPACE"

[swpc_kp.model]
obs_scale        = 0.3
level_var        = 1e-3
time_scale       = 3600.0

[swpc_kp.display]
label            = "Geomagnetic activity (Kp, NOAA)"
about            = "How disturbed Earth's magnetic field is (Kp 0-9), every minute. Storms (Kp 5+) disturb GPS, radio and, when severe, power grids."
digits           = 1

[swpc_kp.alerts]
tail             = "upper"
reach_km         = "global"
harm_levels      = [[5, "a geomagnetic storm (G1, Kp 5+)"], [7, "a strong storm (G3, Kp 7+)"], [8, "a severe storm (G4, Kp 8+): grid and GPS trouble likely"], [9, "an extreme storm (G5, Kp 9)"]]
harm_below       = "below storm level (Kp < 5)"
harm_value       = "max"
harm_confirmed   = 3


[swpc_xray]
class            = "space_weather"
modality         = "physical"
topic_tags       = ["space-weather", "solar-flare"]
flavor           = "continuous"
endpoint         = "https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json"
cadence_seconds  = 600
status           = "nursery"
notes            = "GOES primary X-ray flux 0.1-0.8 nm, 1-min; value = log(W/m2); public domain"

[swpc_xray.parse]
format           = "records"
time_field       = "time_tag"
value_field      = "flux"
transform        = "log"
where            = { energy = ["0.1-0.8nm"] }

[swpc_xray.geocode]
cell             = "SPACE"

[swpc_xray.model]
obs_scale        = 0.2
level_var        = 1e-2
time_scale       = 3600.0

[swpc_xray.display]
label            = "Solar X-rays (GOES)"
about            = "The Sun's X-ray brightness, every minute: flares. M- and X-class flares black out HF radio on the day side of Earth."
unit             = " W/m²"
inverse          = "exp"
digits           = 7

[swpc_xray.alerts]
tail             = "upper"
reach_km         = "global"
harm_levels      = [[1e-5, "an M-class flare: HF radio blackouts"], [1e-4, "an X-class flare: strong radio blackouts"]]
harm_below       = "below flare level (M1)"
harm_confirmed   = 2


[swpc_solar_wind]
class            = "space_weather"
modality         = "physical"
topic_tags       = ["space-weather", "solar-wind"]
flavor           = "continuous"
endpoint         = "https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json"
cadence_seconds  = 300
status           = "nursery"
notes            = "NOAA SWPC real-time solar wind speed (km/s); public domain"

[swpc_solar_wind.parse]
format           = "records"
time_field       = "time_tag"
value_field      = "proton_speed"
transform        = "log"

[swpc_solar_wind.geocode]
cell             = "SPACE"

[swpc_solar_wind.model]
obs_scale        = 0.05
level_var        = 1e-3
time_scale       = 3600.0

[swpc_solar_wind.display]
label            = "Solar wind speed (NOAA)"
about            = "How fast the solar wind reaches Earth; a jump comes before geomagnetic storms."
unit             = " km/s"
inverse          = "exp"

[swpc_solar_wind.alerts]
tail             = "upper"
reach_km         = "global"

# --- volcanic ash, fires ---------------------------------------------------------

[sigmet_volcanic_ash]
class            = "aviation_hazard"
modality         = "physical"
topic_tags       = ["volcano", "aviation", "hazard"]
flavor           = "count"
endpoint         = "https://aviationweather.gov/api/data/isigmet?format=json"
cadence_seconds  = 900
status           = "nursery"
notes            = "International SIGMETs for volcanic ash (aviationweather.gov); counted per ash area; public domain"

[sigmet_volcanic_ash.parse]
format           = "records"
time_field       = "validTimeFrom"
time_format      = "epoch"
where            = { hazard = ["VA"] }
id_fields        = ["icaoId", "seriesId"]

[sigmet_volcanic_ash.geocode]
strategy         = "coords"
polygon_field    = "coords"
h3_resolution    = 3

[sigmet_volcanic_ash.model]
native_seconds   = 3600

[sigmet_volcanic_ash.display]
label            = "Volcanic ash warnings (SIGMET)"
about            = "Warnings to aircraft of volcanic ash clouds, issued by the world's flight information regions."
unit             = "warnings"

[sigmet_volcanic_ash.context]
fields           = ["firName", "hazard", "qualifier", "top", "rawSigmet"]
text             = "Volcanic ash| in {firName}| up to {top} ft"

[sigmet_volcanic_ash.alerts]
tail             = "upper"
reach_km         = 500

[firms_viirs_noaa21]
class            = "fire_hotspots"
modality         = "physical"
topic_tags       = ["fire", "hazard", "satellite"]
flavor           = "count"
endpoint         = "https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-21-viirs-c2/csv/J2_VIIRS_C2_Global_24h.csv"
cadence_seconds  = 10800
status           = "nursery"
notes            = "NASA FIRMS VIIRS active fire, NOAA-21, NRT global 24 h file (~7.5 MB, If-Modified-Since); value = fire radiative power (MW)"

[firms_viirs_noaa21.fetch]
kind             = "text_get"
timeout          = 180

[firms_viirs_noaa21.parse]
format           = "records"
text_format      = "csv"
time_fields      = ["acq_date", "acq_time"]
time_format      = "%Y-%m-%d %H%M"
value_field      = "frp"
where            = { confidence = ["nominal", "high"] }
id_fields        = ["latitude", "longitude"]
id_spread        = 60

[firms_viirs_noaa21.geocode]
strategy         = "coords"
lat_field        = "latitude"
lon_field        = "longitude"
