# --- tropical cyclones, tsunamis --------------------------------------------------

[jtwc_cyclones]
class            = "cyclone_warnings"
modality         = "physical"
topic_tags       = ["cyclone", "hazard", "official"]
flavor           = "count"
endpoint         = "https://www.metoc.navy.mil/jtwc/rss/jtwc.rss"
cadence_seconds  = 1800
status           = "nursery"
notes            = "JTWC tropical cyclone warnings: NW Pacific, North Indian Ocean (Arabian Sea, Bay of Bengal), southern hemisphere; US government, public domain"

[jtwc_cyclones.fetch]
kind             = "linked_get"
link_pattern     = 'https://www\.metoc\.navy\.mil/jtwc/products/[a-z]{2}\d{4}web\.txt'
max_items        = 12

[jtwc_cyclones.parse]
format           = "jtwc_warnings"

[jtwc_cyclones.geocode]
h3_resolution    = 3

[jtwc_cyclones.model]
native_seconds   = 21600

[jtwc_cyclones.display]
label            = "Tropical cyclones (JTWC)"
about            = "Warnings from the US Joint Typhoon Warning Center, including the Arabian Sea: each storm's position and strongest sustained wind."
unit             = "warnings"
max_prefix       = ""

[jtwc_cyclones.context]
fields           = ["name", "wind_kt", "position", "url"]
text             = "{name}|: {wind_kt} kt| at {position}"
link             = "url"

[jtwc_cyclones.alerts]
tail             = "upper"
reach_km         = 500
# harm: maximum sustained wind (kt); 100 kt+ confirmed may wake where it can reach
harm_levels      = [[64, "cyclone strength (64 kt+)"], [100, "a very severe cyclone (100 kt+)"]]
harm_below       = "below cyclone strength"
harm_floor       = false
harm_confirmed   = 2
harm_extreme     = 2


[nhc_storms]
class            = "cyclone_warnings"
modality         = "physical"
topic_tags       = ["cyclone", "hazard", "official"]
flavor           = "count"
endpoint         = "https://www.nhc.noaa.gov/CurrentStorms.json"
cadence_seconds  = 1800
status           = "nursery"
notes            = "NOAA NHC active storms (Atlantic, E/C Pacific): one row per advisory; public domain"

[nhc_storms.parse]
format           = "records"
records          = "activeStorms"
time_field       = "lastUpdate"
value_field      = "intensity"
id_fields        = ["id"]
id_spread        = 60

[nhc_storms.geocode]
strategy         = "coords"
lat_field        = "latitudeNumeric"
lon_field        = "longitudeNumeric"
h3_resolution    = 3

[nhc_storms.model]
native_seconds   = 21600

[nhc_storms.display]
label            = "Hurricanes (NHC)"
about            = "Active Atlantic and eastern Pacific storms from the US National Hurricane Center, each advisory with the storm's strongest wind."
unit             = "advisories"

[nhc_storms.context]
fields           = ["name", "classification", "intensity", "pressure", "publicAdvisory.url"]
text             = "{name}| ({classification})|: {intensity} kt"
link             = "publicAdvisory.url"

[nhc_storms.alerts]
tail             = "upper"
reach_km         = 500
harm_levels      = [[64, "hurricane strength (64 kt+)"], [96, "a major hurricane (Category 3+)"]]
harm_below       = "below hurricane strength"
harm_floor       = false
harm_confirmed   = 2
harm_extreme     = 2

[tsunami_ptwc]
class            = "tsunami_warnings"
modality         = "physical"
topic_tags       = ["tsunami", "hazard", "official"]
flavor           = "count"
endpoint         = "https://www.tsunami.gov/events/xml/PHEBAtom.xml"
cadence_seconds  = 300
status           = "nursery"
notes            = "tsunami.gov bulletins, Pacific Tsunami Warning Center; watches and warnings only; public domain"

[tsunami_ptwc.fetch]
kind             = "text_get"

[tsunami_ptwc.parse]
format           = "tsunami_atom"
min_level        = 2       # watches and warnings (information statements and advisories dropped)

[tsunami_ptwc.geocode]
h3_resolution    = 3

[tsunami_ptwc.display]
label            = "Tsunami warnings (PTWC)"
about            = "Tsunami watches and warnings from the US Pacific Tsunami Warning Center."
unit             = "bulletins"

[tsunami_ptwc.context]
fields           = ["category", "region", "magnitude", "url"]
text             = "Tsunami {category}| for {region}| (M{magnitude})"
link             = "url"

[tsunami_ptwc.alerts]
every_event      = true    # authoritative: each watch or warning alerts (ADR 0001)
severity         = 0.95
fresh_seconds    = 7200
push_score       = 15      # confirmed, and extreme: may wake where it can reach
reach_km         = 1000

[tsunami_ntwc]
class            = "tsunami_warnings"
modality         = "physical"
topic_tags       = ["tsunami", "hazard", "official"]
flavor           = "count"
endpoint         = "https://www.tsunami.gov/events/xml/PAAQAtom.xml"
cadence_seconds  = 300
status           = "nursery"
notes            = "tsunami.gov bulletins, National Tsunami Warning Center (Alaska); watches and warnings only; public domain"

