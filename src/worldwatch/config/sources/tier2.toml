# --- air quality ------------------------------------------------------------------
# harm (ADR 0004), PM2.5 in µg/m³: the US EPA AQI breakpoints (2024), read on the hour's
# value (the AQI proper uses a 24-h mean)

[sensor_community_pm25]
class            = "air_quality_citizen"
modality         = "physical"
topic_tags       = ["air-quality", "smoke", "pollution"]
flavor           = "continuous"
endpoint         = "https://data.sensor.community/airrohr/v1/filter/type=SDS011"
cadence_seconds  = 1800
status           = "nursery"
notes            = "Sensor.Community citizen PM sensors (SDS011, last 5 min, gzip ~0.8 MB); the median per H3 res-4 cell of 3+ outdoor sensors; ODbL. Sensor ids and positions dropped at the door"

[sensor_community_pm25.parse]
format           = "cell_aggregate"
aggregate        = "median"
value_field      = "sensordatavalues[value_type=P2].value"
max_value        = 500     # the SDS011 saturates near 1000
where            = { "location.indoor" = [0] }
min_records      = 3
record_time_field = "timestamp"
bucket_seconds   = 1800
transform        = "log1p"

[sensor_community_pm25.geocode]
strategy         = "coords"
lat_field        = "location.latitude"
lon_field        = "location.longitude"
h3_resolution    = 4

[sensor_community_pm25.model]
obs_scale        = 0.2
level_var        = 1e-2
time_scale       = 3600.0
periods_seconds  = [86400]

[sensor_community_pm25.display]
label            = "Fine particles, citizen sensors (Sensor.Community)"
about            = "PM2.5, the smoke and dust particles that reach the lungs, from volunteers' sensors, mostly in Europe: the median of the sensors in each area."
unit             = " µg/m³"
inverse          = "expm1"
digits           = 1
links            = [["Air map", "https://maps.sensor.community/#9/{lat}/{lon}"]]

[sensor_community_pm25.alerts]
tail             = "upper"
reach_km         = 100
harm_levels      = [[35.5, "unhealthy for sensitive groups (US AQI 101+)"], [55.5, "unhealthy (US AQI 151+)"], [125.5, "very unhealthy (US AQI 201+)"], [225.5, "hazardous (US AQI 301+)"]]
harm_below       = "below the US 'unhealthy for sensitive groups' level"
harm_value       = "mean"
harm_confirmed   = 3


[airnow_pm25]
class            = "air_quality_regulatory"
modality         = "physical"
topic_tags       = ["air-quality", "smoke", "pollution"]
flavor           = "continuous"
endpoint         = "https://files.airnowtech.org/airnow/{start_dt:%Y/%Y%m%d}/HourlyAQObs_{start_dt:%Y%m%d%H}.dat"
cadence_seconds  = 1800
status           = "nursery"
notes            = "US EPA AirNow hourly observations (US, Canada, Mexico, US embassies), ~1 MB/h; PM2.5 per monitor"

[airnow_pm25.fetch]
kind             = "text_get"

[airnow_pm25.parse]
format           = "records"
text_format      = "csv"
lookback_seconds = 7200    # the hour's file appears ~40 min after it ends
time_fields      = ["ValidDate", "ValidTime"]
time_format      = "%m/%d/%Y %H:%M"
value_field      = "PM25"
where            = { PM25_Measured = ["1"] }
transform        = "log1p"
site_field       = "AQSID"

[airnow_pm25.geocode]
strategy         = "coords"
lat_field        = "Latitude"
lon_field        = "Longitude"
h3_resolution    = 7

[airnow_pm25.model]
obs_scale        = 0.2
level_var        = 1e-2
time_scale       = 3600.0
periods_seconds  = [86400]

[airnow_pm25.display]
label            = "Fine particles, North America (AirNow)"
about            = "PM2.5 from official monitors in the US, Canada and Mexico (and US embassies), hourly."
unit             = " µg/m³"
inverse          = "expm1"
digits           = 1
links            = [["Fire & smoke map", "https://fire.airnow.gov/#9/{lat}/{lon}"]]

[airnow_pm25.context]
fields           = ["SiteName", "StateName", "CountryCode", "PM25", "PM25_AQI"]
text             = "{SiteName}|, {StateName}|: PM2.5 {PM25} µg/m³| (AQI {PM25_AQI})"

[airnow_pm25.alerts]
tail             = "upper"
reach_km         = 100
harm_levels      = [[35.5, "unhealthy for sensitive groups (US AQI 101+)"], [55.5, "unhealthy (US AQI 151+)"], [125.5, "very unhealthy (US AQI 201+)"], [225.5, "hazardous (US AQI 301+)"]]
harm_below       = "below the US 'unhealthy for sensitive groups' level"
harm_value       = "mean"
harm_confirmed   = 3

