# --- fires from geostationary orbit: GOES-East/West ABI FDC (NOAA NODD) -----------
# Full-disk fire detection every 10 min, on AWS within seconds of the scan;
# public domain, no account. The Americas and the eastern/central Pacific.
# A scan is 1–2 MB; taking every other one (cadence 20 min) is ~210 MB/day for
# both satellites (every scan: ~410 MB/day). Same physics as FIRMS at 2 km
# instead of 375 m, so it sees fewer, bigger fires, hours earlier; FIRMS stays
# the finer cross-check. Meteosat (LSA SAF, account) and Himawari (JAXA) later.

[goes19_fire]
class            = "fire_hotspots"
modality         = "physical"
topic_tags       = ["fire", "hazard", "satellite"]
flavor           = "count"
