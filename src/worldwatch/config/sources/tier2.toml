# --- trace gases from space: Sentinel-5P TROPOMI via Copernicus Data Space ----------
# Daily box means from the Sentinel Hub Statistical API (no imagery downloaded).
# Free CDSE account → OAuth client (WW_CDSE_CLIENT_ID / WW_CDSE_CLIENT_SECRET).
# Free tier: 10,000 requests a month; each box costs one request per local day
# (plus up to two retries when NRTI is late), ~57 boxes → ≤ ~5,000 a month.
# NRTI only (~3 h after the pass): a mix with OFFL would change past days.
# Clouds and low-QA pixels are no-data: a day with < 20% valid pixels is missing.
# Contains modified Copernicus Sentinel data (licence: free, attribution).

[s5p_no2]
class            = "trace_gas"
modality         = "physical"
topic_tags       = ["air-quality", "industry", "activity", "satellite"]
flavor           = "continuous"
endpoint         = "https://sh.dataspace.copernicus.eu/statistics/v1"
cadence_seconds  = 10800
