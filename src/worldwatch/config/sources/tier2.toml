# Batch 1 of the 2026-09-27 source review (doc/source-review-2026-09.md): keyless,
# live or near-live sources. All start in the nursery.

# --- official warnings near the Gulf (CAP) ---------------------------------------
# The UAE's own met service publishes no CAP feed; these are the neighbours'.

[cap_saudi]
class            = "cap_alert_feed"
modality         = "physical"
topic_tags       = ["weather", "hazard", "official"]
flavor           = "count"
endpoint         = "https://ncm.gov.sa/en/cap-alerts"
cadence_seconds  = 600
status           = "nursery"
notes            = "Official CAP warnings, Saudi Arabia: National Center for Meteorology (NCM), Saudi Arabia; CC BY 4.0"

[cap_saudi.fetch]
kind             = "linked_get"
link_pattern     = 'https://www\.ncm\.gov\.sa/cap/en/alerts/[^<\s]+\.xml'
max_items        = 40

[cap_saudi.parse]
format           = "cap_alerts"

[cap_saudi.geocode]
h3_resolution    = 3
country          = "SA"    # alerts without coordinates

[cap_saudi.model]
native_seconds   = 3600

[cap_saudi.display]
label            = "Official warnings, Saudi Arabia"
about            = "Warnings from National Center for Meteorology (NCM), Saudi Arabia, in the common alerting format (CAP): dust, heat, rain, floods, storms."
unit             = "warnings"
max_prefix       = "severity "
links            = [["NCM Saudi Arabia", "https://ncm.gov.sa/en/"]]

[cap_saudi.context]
fields           = ["event", "headline", "severity", "urgency", "certainty", "sender", "area", "url"]
text             = "{event}| ({severity})|: {area}"
link             = "url"

[cap_saudi.alerts]
tail             = "upper"
reach_km         = 300
# harm (ADR 0004): the CAP severity (Minor 1 ... Extreme 4); an Extreme warning skips the budget
harm_levels      = [[4, "an Extreme warning"]]
harm_floor       = false
harm_confirmed   = 1

