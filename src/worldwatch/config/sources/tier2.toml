country_aliases  = { "south korea" = "KR", "north korea" = "KP", "usa" = "US", "united states" = "US", "uk" = "GB", "united kingdom" = "GB", "russia" = "RU", "vietnam" = "VN", "czech republic" = "CZ", "czechia" = "CZ", "turkey" = "TR", "türkiye" = "TR", "taiwan" = "TW", "hong kong" = "HK", "macau" = "MO", "ivory coast" = "CI", "democratic republic of the congo" = "CD", "republic of the congo" = "CG", "bosnia and herzegovina" = "BA", "moldova" = "MD", "laos" = "LA", "palestine" = "PS", "iran" = "IR", "syria" = "SY", "bolivia" = "BO", "venezuela" = "VE", "tanzania" = "TZ" }

[cloudflare_pops.geocode]
h3_resolution    = 3

[cloudflare_pops.model]
native_seconds   = 3600

[cloudflare_pops.display]
label            = "Cloudflare data centres degraded"
about            = "Cloudflare's own status page: which of its data centres, in some 300 cities, are not fully working."
unit             = "data centres"

[cloudflare_pops.context]
fields           = ["component", "status"]
text             = "{component}|: {status}"

[cloudflare_pops.alerts]
tail             = "upper"
reach_km         = 300


[wikipedia_languages]
class            = "attention"
modality         = "informational"
topic_tags       = ["attention", "wikipedia"]
flavor           = "continuous"
endpoint         = "https://dumps.wikimedia.org/other/pageviews/{start_dt:%Y/%Y-%m}/projectviews-{start_dt:%Y%m%d-%H}0000"
cadence_seconds  = 1800
status           = "nursery"
notes            = "Wikimedia hourly projectviews (26 KB): Wikipedia views per language (desktop + mobile); CC0"

[wikipedia_languages.fetch]
kind             = "text_get"

[wikipedia_languages.parse]
format           = "wiki_projectviews"
lookback_seconds = 10800   # the hour's file appears 1.2-2 h after it ends
languages        = ["ar", "fa", "he", "tr", "ur", "hi", "uk", "ru", "zh", "ja", "ko", "de", "fr", "es", "pt", "it", "pl", "id", "vi", "bn"]

[wikipedia_languages.geocode]
strategy         = "project_entity"

[wikipedia_languages.model]
obs_scale        = 0.05
level_var        = 1e-3
time_scale       = 3600.0
periods_seconds  = [86400, 604800]

[wikipedia_languages.display]
label            = "Wikipedia reading, by language"
about            = "How much each language's Wikipedia is read, hourly: a jump is attention; a sudden fall can be a country's internet going down."
unit             = " views/h"
inverse          = "expm1"

