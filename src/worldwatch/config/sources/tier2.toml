notes            = "Sentinel-5P TROPOMI tropospheric NO2, NRTI, minQa 75, daily mean per 1° box; value = log1p(µmol/m²)"

[s5p_no2.fetch]
kind             = "cdse_statistics"
band             = "NO2"
min_qa           = 75
resolution_deg   = 0.05
retry_hours      = 6

[s5p_no2.parse]
format           = "cdse_s5p_stats"
scale            = 1e6
transform        = "log1p"

[s5p_no2.geocode]
strategy         = "boxes"
h3_resolution    = 3
boxes            = { london = [51.00, -0.62, 52.00, 0.38], paris = [48.36, 1.85, 49.36, 2.85], ruhr = [50.95, 6.50, 51.95, 7.50], po_valley = [44.96, 8.69, 45.96, 9.69], madrid = [39.92, -4.20, 40.92, -3.20], istanbul = [40.51, 28.48, 41.51, 29.48], moscow = [55.25, 37.12, 56.25, 38.12], kyiv = [49.95, 30.02, 50.95, 31.02], cairo = [29.54, 30.74, 30.54, 31.74], tehran = [35.19, 50.89, 36.19, 51.89], riyadh = [24.21, 46.18, 25.21, 47.18], kuwait = [28.87, 47.48, 29.87, 48.48], karachi = [24.36, 66.50, 25.36, 67.50], delhi = [28.11, 76.71, 29.11, 77.71], mumbai = [18.58, 72.38, 19.58, 73.38], dhaka = [23.31, 89.91, 24.31, 90.91], beijing = [39.40, 115.90, 40.40, 116.90], shanghai = [30.73, 120.97, 31.73, 121.97], pearl_river = [22.50, 113.00, 23.50, 114.00], seoul = [37.07, 126.48, 38.07, 127.48], tokyo = [35.18, 139.19, 36.18, 140.19], jakarta = [-6.70, 106.35, -5.70, 107.35], highveld = [-26.50, 28.70, -25.50, 29.70], lagos = [6.02, 2.88, 7.02, 3.88], los_angeles = [33.55, -118.74, 34.55, -117.74], new_york = [40.21, -74.50, 41.21, -73.50], mexico_city = [18.93, -99.63, 19.93, -98.63], sao_paulo = [-24.05, -47.13, -23.05, -46.13], buenos_aires = [-35.10, -58.88, -34.10, -57.88] }

[s5p_no2.model]
