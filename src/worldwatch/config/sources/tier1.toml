# Tier-1 source stanzas — one per flavor for reference.
# Auth tokens go in env vars, never here.

[usgs_seismic]
class            = "seismic_feed"
modality         = "physical"
topic_tags       = ["seismic", "hazard"]
flavor           = "count"
endpoint         = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson"
cadence_seconds  = 60      # USGS updates its feeds every minute (ADR 0002 §D)
status           = "nursery"
notes            = "USGS all-hour summary feed (GeoJSON); dedup by PK across overlapping polls"

[usgs_seismic.parse]
format           = "geojson_features"
value_field      = "mag"
time_field       = "time"
filter_min_mag   = 1.0

[usgs_seismic.geocode]
strategy         = "feature_coords"
h3_resolution    = 3

[usgs_seismic.model]
native_seconds   = 300     # 5-min report windows; polled every minute

[usgs_seismic.display]
label            = "Earthquakes (M1+)"
unit             = "quakes"
max_prefix       = "M"

[usgs_seismic.context]
fields           = ["title", "place", "mag", "magType", "depth_km", "url", "tsunami", "alert", "felt", "sig"]
rank             = "mag"
text             = "M{mag}| {place}|, depth {depth_km:.0f} km"   # "|": optional pieces
link             = "url"


# Continuous, not count: the hourly `views` value is the signal — as a count
# stream Layer 0 would score bins.n (rows per bin, a near-constant) and ignore
# views entirely. log1p + a fixed obs_scale keep the Student-t predictive sane
# until P1's online scale inference; daily+weekly harmonics carry the cycle.
[wikipedia_pageviews]
class            = "attention_feed"
modality         = "informational"
topic_tags       = ["attention", "information"]
flavor           = "continuous"
endpoint         = "https://wikimedia.org/api/rest_v1/metrics/pageviews/aggregate/{project}/{access}/{agent}/{granularity}/{start}/{end}"
cadence_seconds  = 3600
status           = "nursery"
notes            = "Hourly project-level pageview aggregates; value = log1p(views)"

[wikipedia_pageviews.parse]
format           = "wikimedia_pageviews"
project          = "en.wikipedia.org"
access           = "all-access"
agent            = "all-agents"
granularity      = "hourly"
lookback_seconds = 259200   # 3 days; overlapping windows dedup on the raw_ring PK
transform        = "log1p"

[wikipedia_pageviews.geocode]
strategy         = "project_entity"

[wikipedia_pageviews.model]
periods_seconds  = [86400.0, 604800.0]
n_harmonics      = 2
obs_scale        = 0.05   # ~5% residual on log-views; fixed until P1
level_var        = 1e-4

[wikipedia_pageviews.display]
label            = "English Wikipedia views"
unit             = " views/h"
inverse          = "expm1"


# value = log1p(price): multiplicative moves on a fixed obs_scale (see the
# wikipedia stanza note). ~0.4%/√h log-price diffusion → level_var; no
# harmonics (crypto trades around the clock, no strong daily cycle).
[btc_usd]
class            = "crypto_market"
modality         = "economic"
topic_tags       = ["markets", "crypto"]
flavor           = "continuous"
endpoint         = "wss://ws-feed.exchange.coinbase.com"
cadence_seconds  = 60
status           = "nursery"
notes            = "BTC/USD from the Coinbase WebSocket ticker (push, ADR 0002 §D); value = log1p(price)"

[btc_usd.fetch]
kind             = "websocket"
subscribe        = { type = "subscribe", product_ids = ["BTC-USD"], channels = ["ticker"] }
emit_every_seconds = 60      # ~8 ticks/s thinned to one a minute...
emit_delta       = 0.003     # ...but a 0.3% move (log price) goes out at once

[btc_usd.parse]
format           = "coinbase_ticker"
product_id       = "BTC-USD"
transform        = "log1p"

[btc_usd.geocode]
strategy         = "global"
cell             = "GLOBAL"

[btc_usd.model]
obs_scale        = 0.001   # prior guess, ~0.1% per minute; the scale is learned
level_var        = 2e-5

[btc_usd.display]
label            = "Bitcoin"
prefix           = "$"
inverse          = "expm1"


# Adding a second market is stanza-only — reuses the coinbase_ticker parser.
[eth_usd]
class            = "crypto_market"
modality         = "economic"
topic_tags       = ["markets", "crypto"]
flavor           = "continuous"
endpoint         = "wss://ws-feed.exchange.coinbase.com"
cadence_seconds  = 60
status           = "nursery"
notes            = "ETH/USD from the Coinbase WebSocket ticker (push, ADR 0002 §D); value = log1p(price)"

[eth_usd.fetch]
kind             = "websocket"
subscribe        = { type = "subscribe", product_ids = ["ETH-USD"], channels = ["ticker"] }
emit_every_seconds = 60      # ~8 ticks/s thinned to one a minute...
emit_delta       = 0.003     # ...but a 0.3% move (log price) goes out at once

[eth_usd.parse]
format           = "coinbase_ticker"
product_id       = "ETH-USD"
transform        = "log1p"

[eth_usd.geocode]
strategy         = "global"
cell             = "GLOBAL"

[eth_usd.model]
obs_scale        = 0.0015  # prior guess; ETH runs a touch more volatile than BTC
level_var        = 4e-5

[eth_usd.display]
label            = "Ether"
prefix           = "$"
inverse          = "expm1"


[nws_severe_alerts]
class            = "weather_alert_feed"
modality         = "physical"
topic_tags       = ["weather", "hazard", "severe"]
flavor           = "count"
endpoint         = "https://api.weather.gov/alerts/active"
cadence_seconds  = 900
status           = "nursery"
notes            = "NWS active alerts (US); polygon/point alerts only — zone-only (null-geometry) alerts skipped in P0"

[nws_severe_alerts.parse]
format           = "geojson_events"
time_field       = "onset"

[nws_severe_alerts.geocode]
strategy         = "feature_coords"
h3_resolution    = 3

[nws_severe_alerts.display]
label            = "US weather alerts (NWS)"
unit             = "alerts"

[nws_severe_alerts.context]
fields           = ["event", "headline", "severity", "urgency", "certainty", "areaDesc"]
text             = "{event}| ({severity})|: {areaDesc}"
# NWS alert ids are API URLs (JSON), not pages for people, so no link field


[safecast_radiation]
class            = "radiation_station"
modality         = "physical"
topic_tags       = ["radiation", "nuclear"]
flavor           = "continuous"
endpoint         = "https://api.safecast.org/measurements.json"
cadence_seconds  = 900
status           = "nursery"
notes            = "Citizen radiation network; geocoded point measurements"

[safecast_radiation.parse]
format           = "safecast_json"
value_field      = "value"
unit             = "cpm"

[safecast_radiation.geocode]
strategy         = "feature_coords"
h3_resolution    = 4

[safecast_radiation.display]
label            = "Radiation (Safecast)"
unit             = " cpm"


# --- News events: GDELT 2.0 raw 15-min export files --------------------------

[gdelt_events]
class            = "news_event_feed"
modality         = "informational"
topic_tags       = ["news", "events", "society", "conflict"]
flavor           = "count"
endpoint         = "https://data.gdeltproject.org/gdeltv2/lastupdate.txt"
cadence_seconds  = 900
status           = "nursery"
notes            = "GDELT 2.0 export batches (~1 MB zip / 15 min, no auth; https, with a GCS-bucket fallback when the CDN serves a stale 404). Only the newest batch is listed, so a missed poll is a skipped batch (visible to the presence channel). Geocoded events only; per-event content dropped at the door."

[gdelt_events.fetch]
kind             = "gdelt_lastupdate"
file_marker      = ".export.CSV.zip"

[gdelt_events.parse]
format           = "gdelt_export_events"

[gdelt_events.geocode]
strategy         = "feature_coords"
h3_resolution    = 3

[gdelt_events.display]
label            = "News events (GDELT)"
unit             = "events"

# News is what the sensors race to beat, not independent confirmation of them:
# it never counts toward corroboration; pushes show it as context.
[gdelt_events.alerts]
role             = "context"

# Kept per event for the evidence store (never detection): the GDELT 2.0
# export columns below, plus `action` (EventRootCode in words) and `actors`.
[gdelt_events.context]
columns          = { actor1 = 6, actor2 = 16, code = 26, root = 28, goldstein = 30, mentions = 31, sources = 32, tone = 34, place = 52, url = 60 }
fields           = ["headline", "action", "actors", "place", "mentions", "sources", "tone", "goldstein", "code", "url"]
rank             = "mentions"
text             = "{headline}| - {action}|, {place}"
link             = "url"


