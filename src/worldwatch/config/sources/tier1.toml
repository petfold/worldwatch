[fx_usd.model]
obs_scale        = 3e-4    # prior guess, 0.03% an hour; the scale is learned per currency
level_var        = 2e-7    # one value for every currency; on synthetic hourly walks it keeps the
                           # majors' tails calibrated and makes a 1% peg break p ≈ 1e-5 (1e-6: 3e-4)
trend_var        = 1e-9    # slow crawls (TRY, ARS) without chasing noise

[fx_usd.display]
label            = "Exchange rates (per US dollar)"
about            = "What one US dollar buys in each of 57 currencies, every hour (Open Exchange Rates). A currency losing value shows as a rise."
inverse          = "exp"
digits           = 4

[fx_usd.context]
fields           = ["key", "value"]
text             = "{key}|: {value} per US dollar"

[fx_usd.alerts]
tail             = "upper"   # harm is a currency falling: more of it per dollar (ADR 0004)
reach_km         = 1000


[nws_severe_alerts]
class            = "weather_alert_feed"
modality         = "physical"
topic_tags       = ["weather", "hazard", "severe"]
flavor           = "count"
endpoint         = "https://api.weather.gov/alerts/active?severity=Severe,Extreme"
cadence_seconds  = 120     # ~60 KB once thinned (was ~2.4 MB for every advisory)
status           = "nursery"
notes            = "NWS active alerts (US); polygon/point alerts only — zone-only (null-geometry) alerts skipped in P0"

[nws_severe_alerts.parse]
