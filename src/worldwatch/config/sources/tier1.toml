# Tier-1 source stanzas — one per flavor for reference.
# Auth tokens go in env vars, never here.

[usgs_seismic]
class            = "seismic_feed"
modality         = "physical"
topic_tags       = ["seismic", "hazard"]
flavor           = "count"
endpoint         = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson"
cadence_seconds  = 300
status           = "nursery"
notes            = "USGS all-hour summary feed (GeoJSON); dedup by PK across overlapping polls"

[usgs_seismic.parse]
format           = "geojson_features"
value_field      = "mag"
time_field       = "time"
filter_min_mag   = 1.0

[usgs_seismic.geocode]
strategy         = "feature_coords"
h3_resolution    = 3


[wikipedia_pageviews]
class            = "attention_feed"
modality         = "informational"
topic_tags       = ["attention", "information"]
flavor           = "count"
endpoint         = "https://wikimedia.org/api/rest_v1/metrics/pageviews/aggregate/{project}/{access}/{agent}/{granularity}/{start}/{end}"
cadence_seconds  = 3600
status           = "nursery"
notes            = "Hourly project-level pageview aggregates"

[wikipedia_pageviews.parse]
format           = "wikimedia_pageviews"
project          = "en.wikipedia.org"
access           = "all-access"
agent            = "all-agents"
granularity      = "hourly"
lookback_seconds = 259200   # 3 days; overlapping windows dedup on the raw_ring PK

[wikipedia_pageviews.geocode]
strategy         = "project_entity"


[btc_usd]
class            = "crypto_market"
modality         = "economic"
topic_tags       = ["markets", "crypto"]
flavor           = "continuous"
endpoint         = "https://api.coinbase.com/v2/prices/BTC-USD/spot"
cadence_seconds  = 300
status           = "nursery"
notes            = "BTC/USD spot price — continuous flavor reference"

[btc_usd.parse]
format           = "coinbase_spot"
value_path       = "data.amount"

[btc_usd.geocode]
strategy         = "global"
cell             = "GLOBAL"


# Adding a second market is stanza-only — reuses the coinbase_spot parser.
[eth_usd]
class            = "crypto_market"
modality         = "economic"
topic_tags       = ["markets", "crypto"]
flavor           = "continuous"
endpoint         = "https://api.coinbase.com/v2/prices/ETH-USD/spot"
cadence_seconds  = 300
status           = "nursery"
notes            = "ETH/USD spot price"

[eth_usd.parse]
format           = "coinbase_spot"
value_path       = "data.amount"

[eth_usd.geocode]
strategy         = "global"
cell             = "GLOBAL"


[nws_severe_alerts]
class            = "weather_alert_feed"
modality         = "physical"
topic_tags       = ["weather", "hazard", "severe"]
flavor           = "count"
endpoint         = "https://api.weather.gov/alerts/active"
cadence_seconds  = 900
status           = "nursery"
notes            = "NWS active alerts (US); polygon/point alerts only — zone-only (null-geometry) alerts skipped in P0"

[nws_severe_alerts.parse]
format           = "geojson_events"
time_field       = "onset"

[nws_severe_alerts.geocode]
strategy         = "feature_coords"
h3_resolution    = 3


[safecast_radiation]
class            = "radiation_station"
modality         = "physical"
topic_tags       = ["radiation", "nuclear"]
flavor           = "continuous"
endpoint         = "https://api.safecast.org/measurements.json"
cadence_seconds  = 900
status           = "nursery"
notes            = "Citizen radiation network; geocoded point measurements"

[safecast_radiation.parse]
format           = "safecast_json"
value_field      = "value"
unit             = "cpm"

[safecast_radiation.geocode]
strategy         = "feature_coords"
h3_resolution    = 4


# --- Internet health: Cloudflare Radar netflows ------------------------------
# Values are min0_max-normalized over the queried window (Radar exposes no raw
# values); the 7d window keeps the anchor (weekly peak) stable across polls.
# The parser drops the in-progress final bucket. Adding a country = copy a
# stanza, change `location=XX` and the centroid lat/lon.

[cf_radar_netflows_global]
class            = "internet_health"
modality         = "infrastructural"
topic_tags       = ["internet", "traffic", "infrastructure"]
flavor           = "continuous"
endpoint         = "https://api.cloudflare.com/client/v4/radar/netflows/timeseries?dateRange=7d&aggInterval=15m&format=json"
cadence_seconds  = 900
auth_env_var     = "WW_CLOUDFLARE_TOKEN"
status           = "nursery"
notes            = "Cloudflare Radar global network-layer traffic, 15-min buckets"

[cf_radar_netflows_global.parse]
format           = "cloudflare_radar_timeseries"

[cf_radar_netflows_global.geocode]
strategy         = "global"
cell             = "GLOBAL"


[cf_radar_netflows_gb]
class            = "internet_health"
modality         = "infrastructural"
topic_tags       = ["internet", "traffic", "infrastructure"]
flavor           = "continuous"
endpoint         = "https://api.cloudflare.com/client/v4/radar/netflows/timeseries?dateRange=7d&aggInterval=15m&format=json&location=GB"
cadence_seconds  = 900
auth_env_var     = "WW_CLOUDFLARE_TOKEN"
status           = "nursery"
notes            = "Cloudflare Radar UK traffic; country centroid cell for spatial coherence"

[cf_radar_netflows_gb.parse]
format           = "cloudflare_radar_timeseries"

[cf_radar_netflows_gb.geocode]
strategy         = "fixed_latlon"
lat              = 54.0
lon              = -2.5
h3_resolution    = 2


[cf_radar_netflows_us]
class            = "internet_health"
modality         = "infrastructural"
topic_tags       = ["internet", "traffic", "infrastructure"]
flavor           = "continuous"
endpoint         = "https://api.cloudflare.com/client/v4/radar/netflows/timeseries?dateRange=7d&aggInterval=15m&format=json&location=US"
cadence_seconds  = 900
auth_env_var     = "WW_CLOUDFLARE_TOKEN"
status           = "nursery"
notes            = "Cloudflare Radar US traffic"

[cf_radar_netflows_us.parse]
format           = "cloudflare_radar_timeseries"

[cf_radar_netflows_us.geocode]
strategy         = "fixed_latlon"
lat              = 39.8
lon              = -98.6
h3_resolution    = 2


[cf_radar_netflows_jp]
class            = "internet_health"
modality         = "infrastructural"
topic_tags       = ["internet", "traffic", "infrastructure"]
flavor           = "continuous"
endpoint         = "https://api.cloudflare.com/client/v4/radar/netflows/timeseries?dateRange=7d&aggInterval=15m&format=json&location=JP"
cadence_seconds  = 900
auth_env_var     = "WW_CLOUDFLARE_TOKEN"
status           = "nursery"
notes            = "Cloudflare Radar Japan traffic"

[cf_radar_netflows_jp.parse]
