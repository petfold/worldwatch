# --- Radiation: EURDEP + German ODL (BfS open data, WFS GeoJSON) ------------
# EURDEP: ~17,000 official gamma dose-rate stations in ~40 countries, hourly,
# republished openly by Germany's BfS (no access constraints or fees declared;
# ~240 KB gzipped per poll). Germany's own ~1,700 stations are a separate BfS
# layer. Each station sits in its own fine cell (H3 res 10, ~120 m; co-located
# detectors collapse to the lowest station id), so it is its own series; the
# alert engine groups stations into regions. Countries report at
# their own pace, so a poll carries each station's latest hour — dedup by
# (station cell, hour) keeps every measurement once.
# Radiation may alert on its own (no other source sees it), confirmed within
# the network in space rather than time: >= min_sensors stations in one region,
# each with one reading at p <= q_tail (ADR 0002 "confirm in space before
# time"). Known confounder: rain washes radon progeny down and raises dose
# rates regionally — guarded by size and, later, precipitation (research agenda).

[eurdep_gamma]
class            = "radiation_network"
modality         = "physical"
topic_tags       = ["radiation", "nuclear"]
flavor           = "continuous"
endpoint         = "https://www.imis.bfs.de/ogc/opendata/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=opendata:eurdep_latestValue&outputFormat=application/json"
cadence_seconds  = 1800
status           = "nursery"
notes            = "EURDEP gamma ambient dose rate (µSv/h, 1 h), via BfS open data; value = log(dose rate)"

[eurdep_gamma.parse]
format           = "geojson_events"
time_fields      = ["end_measure"]
value_field      = "value"
transform        = "log"
where            = { site_status = [1] }
site_field       = "id"   # co-located detectors: one series per site

[eurdep_gamma.geocode]
strategy         = "feature_coords"
h3_resolution    = 10     # ~120 m: only truly co-located detectors share a cell

[eurdep_gamma.model]
obs_scale        = 0.05     # ~5% hour-to-hour on log dose rate; learned online
level_var        = 1e-4
time_scale       = 3600.0

[eurdep_gamma.display]
label            = "Radiation, Europe (EURDEP)"
unit             = " µSv/h"
inverse          = "exp"
digits           = 3

[eurdep_gamma.context]
fields           = ["id", "name", "value", "unit", "validated"]
rank             = "value"
text             = "{name}| ({id})|: {value} {unit}"

[eurdep_gamma.alerts]
single_source    = true
min_sensors      = 2      # independent stations agreeing at once (ADR 0002 §C)
q_tail           = 1e-4   # per reading; ~25k neighbour pairs x p^2 ≈ one false alarm / 6 months
region_resolution = 3


[bfs_odl_gamma]
class            = "radiation_network"
modality         = "physical"
topic_tags       = ["radiation", "nuclear"]
flavor           = "continuous"
endpoint         = "https://www.imis.bfs.de/ogc/opendata/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=opendata:odlinfo_odl_1h_latest&outputFormat=application/json"
cadence_seconds  = 1800
status           = "nursery"
notes            = "German ODL network (BfS, ~1,700 stations), gamma dose rate µSv/h, 1 h; defective stations filtered"

[bfs_odl_gamma.parse]
format           = "geojson_events"
time_fields      = ["end_measure"]
value_field      = "value"
transform        = "log"
where            = { site_status = [1] }
site_field       = "id"   # co-located detectors: one series per site

[bfs_odl_gamma.geocode]
strategy         = "feature_coords"
h3_resolution    = 10     # ~120 m: only truly co-located detectors share a cell

[bfs_odl_gamma.model]
obs_scale        = 0.05
level_var        = 1e-4
time_scale       = 3600.0

[bfs_odl_gamma.display]
label            = "Radiation, Germany (BfS)"
unit             = " µSv/h"
inverse          = "exp"
digits           = 3

[bfs_odl_gamma.context]
fields           = ["id", "name", "value", "unit", "validated"]
rank             = "value"
text             = "{name}| ({id})|: {value} {unit}"

[bfs_odl_gamma.alerts]
single_source    = true
min_sensors      = 2      # independent stations agreeing at once (ADR 0002 §C)
q_tail           = 1e-4   # per reading; ~25k neighbour pairs x p^2 ≈ one false alarm / 6 months
region_resolution = 3


# --- Authoritative alerts: the source has already judged significance -------
# Every item is an alert (every_event): no model threshold, no waiting for
# bins to close — fires within one detect pass of the poll.

[usgs_significant]
class            = "seismic_feed"
modality         = "physical"
topic_tags       = ["seismic", "hazard", "significant"]
flavor           = "count"
endpoint         = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_day.geojson"
cadence_seconds  = 60
status           = "nursery"
notes            = "USGS curated significant earthquakes (magnitude, PAGER, felt reports), last day"

[usgs_significant.parse]
format           = "geojson_features"
value_field      = "mag"
time_field       = "time"

[usgs_significant.geocode]
strategy         = "feature_coords"
h3_resolution    = 3

[usgs_significant.display]
label            = "Significant earthquakes (USGS)"
unit             = "quakes"
