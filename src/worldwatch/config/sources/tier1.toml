# Tier-1 source stanzas — one per flavor for reference.
# Auth tokens go in env vars, never here.

[usgs_seismic]
class            = "seismic_feed"
modality         = "physical"
topic_tags       = ["seismic", "hazard"]
flavor           = "count"
endpoint         = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson"
cadence_seconds  = 60      # USGS updates its feeds every minute (ADR 0002 §D)
status           = "nursery"
notes            = "USGS all-hour summary feed (GeoJSON); dedup by PK across overlapping polls"

[usgs_seismic.parse]
format           = "geojson_features"
value_field      = "mag"
time_field       = "time"
filter_min_mag   = 1.0

[usgs_seismic.geocode]
strategy         = "feature_coords"
h3_resolution    = 3

[usgs_seismic.model]
native_seconds   = 300     # 5-min report windows; polled every minute

# M1+ is complete only where US networks are dense: context and local detail,
# never corroboration. Detection uses the uniform M4.5+ stream (usgs_m45).
[usgs_seismic.alerts]
role             = "context"

[usgs_seismic.display]
label            = "Earthquakes, all magnitudes (USGS)"
about            = "Every earthquake the US Geological Survey locates worldwide, counted per area and hour."
unit             = "quakes"
max_prefix       = "M"

[usgs_seismic.context]
fields           = ["title", "place", "mag", "magType", "depth_km", "url", "tsunami", "alert", "felt", "sig"]
rank             = "mag"
text             = "M{mag}| {place}|, depth {depth_km:.0f} km"   # "|": optional pieces
link             = "url"


# Continuous, not count: the hourly `views` value is the signal — as a count
# stream Layer 0 would score bins.n (rows per bin, a near-constant) and ignore
# views entirely. log1p + a fixed obs_scale keep the Student-t predictive sane
# until P1's online scale inference; daily+weekly harmonics carry the cycle.
[wikipedia_pageviews]
class            = "attention_feed"
modality         = "informational"
topic_tags       = ["attention", "information"]
flavor           = "continuous"
endpoint         = "https://wikimedia.org/api/rest_v1/metrics/pageviews/aggregate/{project}/{access}/{agent}/{granularity}/{start}/{end}"
cadence_seconds  = 3600
status           = "nursery"
notes            = "Hourly project-level pageview aggregates; value = log1p(views)"

[wikipedia_pageviews.parse]
format           = "wikimedia_pageviews"
project          = "en.wikipedia.org"
access           = "all-access"
agent            = "all-agents"
granularity      = "hourly"
lookback_seconds = 259200   # 3 days; overlapping windows dedup on the raw_ring PK
transform        = "log1p"

[wikipedia_pageviews.geocode]
strategy         = "project_entity"

[wikipedia_pageviews.model]
periods_seconds  = [86400.0, 604800.0]
n_harmonics      = 2
obs_scale        = 0.05   # ~5% residual on log-views; fixed until P1
level_var        = 1e-4

[wikipedia_pageviews.display]
label            = "English Wikipedia views"
about            = "How many times English Wikipedia is read per hour: a gauge of world attention."
unit             = " views/h"
inverse          = "expm1"


# value = log1p(price): multiplicative moves on a fixed obs_scale (see the
# wikipedia stanza note). ~0.4%/√h log-price diffusion → level_var; no
# harmonics (crypto trades around the clock, no strong daily cycle).
[btc_usd]
class            = "crypto_market"
modality         = "economic"
topic_tags       = ["markets", "crypto"]
flavor           = "continuous"
endpoint         = "wss://ws-feed.exchange.coinbase.com"
cadence_seconds  = 60
status           = "nursery"
notes            = "BTC/USD from the Coinbase WebSocket ticker (push, ADR 0002 §D); value = log1p(price)"

[btc_usd.fetch]
kind             = "websocket"
subscribe        = { type = "subscribe", product_ids = ["BTC-USD"], channels = ["ticker", "heartbeat"] }
ping_interval    = 0         # Coinbase doesn't answer pings reliably (dropped 3× in 2.5 h)...
stale_seconds    = 60        # ...its 1/s heartbeat is the liveness signal instead
emit_every_seconds = 60      # ~8 ticks/s thinned to one a minute...
emit_delta       = 0.003     # ...but a 0.3% move (log price) goes out at once

[btc_usd.parse]
format           = "coinbase_ticker"
product_id       = "BTC-USD"
transform        = "log1p"

[btc_usd.geocode]
strategy         = "global"
cell             = "GLOBAL"

[btc_usd.model]
obs_scale        = 0.001   # prior guess, ~0.1% per minute; the scale is learned
level_var        = 2e-5

[btc_usd.display]
label            = "Bitcoin"
about            = "The Bitcoin price in US dollars (Coinbase), tick by tick."
prefix           = "$"
inverse          = "expm1"


# Adding a second market is stanza-only — reuses the coinbase_ticker parser.
[eth_usd]
class            = "crypto_market"
modality         = "economic"
topic_tags       = ["markets", "crypto"]
flavor           = "continuous"
endpoint         = "wss://ws-feed.exchange.coinbase.com"
cadence_seconds  = 60
status           = "nursery"
notes            = "ETH/USD from the Coinbase WebSocket ticker (push, ADR 0002 §D); value = log1p(price)"

[eth_usd.fetch]
kind             = "websocket"
subscribe        = { type = "subscribe", product_ids = ["ETH-USD"], channels = ["ticker", "heartbeat"] }
ping_interval    = 0         # Coinbase doesn't answer pings reliably (dropped 3× in 2.5 h)...
stale_seconds    = 60        # ...its 1/s heartbeat is the liveness signal instead
emit_every_seconds = 60      # ~8 ticks/s thinned to one a minute...
emit_delta       = 0.003     # ...but a 0.3% move (log price) goes out at once

[eth_usd.parse]
format           = "coinbase_ticker"
product_id       = "ETH-USD"
transform        = "log1p"

[eth_usd.geocode]
strategy         = "global"
cell             = "GLOBAL"

[eth_usd.model]
obs_scale        = 0.0015  # prior guess; ETH runs a touch more volatile than BTC
level_var        = 4e-5

[eth_usd.display]
label            = "Ether"
about            = "The Ether price in US dollars (Coinbase), tick by tick."
prefix           = "$"
inverse          = "expm1"


# Fiat FX: every currency in one request an hour. The free plan allows 1,000
# requests a month and a 304 still counts, so the cadence is the budget.
[fx_usd]
class            = "fx_market"
modality         = "economic"
topic_tags       = ["markets", "fx"]
flavor           = "continuous"
endpoint         = "https://openexchangerates.org/api/latest.json?prettyprint=false"
cadence_seconds  = 3600    # ~730 requests a month of the free plan's 1,000: never faster
auth_env_var     = "WW_OXR_APP_ID"
status           = "nursery"
notes            = "Open Exchange Rates (free plan, hourly): units of each currency per US dollar; value = log(rate). The App ID goes in the Authorization header, never the URL. Weekends repeat Friday's close."

[fx_usd.fetch]
auth_scheme      = "Token"

[fx_usd.parse]
format           = "records"
records          = "rates"
record_items     = true    # {"EUR": 0.88, ...}: one record per currency
doc_time_field   = "timestamp"
time_format      = "epoch"
value_field      = "value"
transform        = "log"

[fx_usd.geocode]
strategy         = "country"
country_field    = "key"
h3_resolution    = 3

# The currencies watched, each in its country's cell (the cell OONI, IODA and
# Tor use); the rest of the ~170 in the payload are dropped.
[fx_usd.geocode.country_map]
EUR = "DE"    # the euro area, placed in Germany
