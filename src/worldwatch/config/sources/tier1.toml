# --- Night lights: NASA Black Marble VNP46A2 ---------------------------------
# One stanza per 10°×10° tile. Endpoint is a CMR granule search (newest first);
# the earthdata_granule fetcher downloads a granule only when its id changes
# (~10 MB once/day per tile) and needs WW_EARTHDATA_USER + WW_EARTHDATA_PASS.
# VNP46A2 lags 2–9 days; observations carry the granule's own day, so they fold
# into the cascade late — accepted (frozen-archive semantics). Days skipped
# while a tile lags surface through the presence channel, never imputed.
# Adding a tile = copy a stanza, change the hXXvYY in endpoint + stream id
# (tile grid: lon_min = -180 + 10·h, lat_max = 90 - 10·v).
# modality is "physical" (satellite radiometry), so blackouts corroborate with
# infrastructural signals like internet traffic.
# Caveat: tiles above ~50°N get NO high-quality retrievals around midsummer
# (nights never reach astronomical darkness → Mandatory_Quality_Flag 2/255,
# verified live on h17v03 in July) — an honest seasonal gap the presence
# channel sees; pick tiles below 50°N for year-round signal.

[night_lights_h17v03]
class            = "night_lights"
modality         = "physical"
topic_tags       = ["nightlights", "power", "activity"]
flavor           = "continuous"
endpoint         = "https://cmr.earthdata.nasa.gov/search/granules.json?short_name=VNP46A2&page_size=1&sort_key=-start_date&options[readable_granule_name][pattern]=true&readable_granule_name[]=*.h17v03.*"
cadence_seconds  = 21600
status           = "nursery"
notes            = "VIIRS Black Marble tile h17v03: UK + Ireland (50-60N: dark-season only, no retrievals ~May-Jul)"

[night_lights_h17v03.fetch]
kind             = "earthdata_granule"

[night_lights_h17v03.parse]
format           = "vnp46a2_grid"

[night_lights_h17v03.geocode]
strategy         = "granule_grid"
h3_resolution    = 4

[night_lights_h17v03.display]
label            = "Night lights, UK + Ireland"
about            = "Brightness of the ground at night from NASA's VIIRS satellite (UK and Ireland): power cuts darken it."
unit             = " nW/cm²/sr"
inverse          = "expm1"
digits           = 1

[night_lights_h17v03.alerts]
reach_km         = 300     # a power outage


[night_lights_h18v04]
