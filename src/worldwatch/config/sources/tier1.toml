# --- Our own active prober (ADR 0002 §E) -------------------------------------
# Every 2 min, probe a quota of public targets per country — NTP pool
# country-zone servers (NTP, UDP 123) and RIPE Atlas anchors (TCP connect) —
# spread across networks. Failures are a count per country; ~12 independent
# targets per country make a spike confirmation in space by itself. A round
# where most targets everywhere fail is our own network (vantage_fault), not
# an event. Target IPs never leave the probe_targets table.

[probe_reachability]
class            = "active_probe"
modality         = "infrastructural"
topic_tags       = ["internet", "outage", "infrastructure", "probe"]
flavor           = "count"
endpoint         = "probe://ntp+anchors"
cadence_seconds  = 120
status           = "nursery"
notes            = "Own reachability probes of NTP pool servers and RIPE Atlas anchors, a quota per country"

[probe_reachability.fetch]
kind             = "probe"
round_seconds    = 120      # >= 64 s per NTP server, as the pool asks
refresh_seconds  = 86400
ntp_quota        = 8
anchor_quota     = 4
vantage_lat      = 49.0     # the VPS (Karlsruhe area); for the light-speed check
vantage_lon      = 8.4
vantage_fault_fraction = 0.5
# opt-outs requested via /about (addresses or CIDR ranges) — never probed
exclude          = []

[probe_reachability.geocode]
strategy         = "country"
h3_resolution    = 3        # res 2 merged 24 small neighbouring countries into shared cells

[probe_reachability.model]
native_seconds   = 120      # one window per round

[probe_reachability.display]
label            = "Reachability (own probes)"
about            = "Worldwatch's own probes: whether time servers and RIPE Atlas anchors in each country answer."
unit             = "unreachable"

[probe_reachability.alerts]
tail             = "upper"   # fewer is harmless: only a rise is evidence
reach_km         = 300
single_source    = true     # our own measurement; confirmation is across a country's targets
min_sensors      = 1        # one country cell already aggregates ~12 independent targets
q_tail           = 1e-4
region_resolution = 3
max_regions      = 5        # more countries failing at once: our vantage point, not them
                            # (2026-09-27: up to 43 at once, 370 pushes); a health record instead
cooldown_seconds = 21600    # one alert per country per episode (6 h), not one per round


